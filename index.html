<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Eco Future · 绿色星球</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= 基础样式 ================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: #020b12;
    color: #e6f7f2;
}

/* ================= 背景动画 ================= */
canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
}

.gradient-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, #0f3d2e, #020b12 70%);
    z-index: -1;
}

/* ================= 页面结构 ================= */
section {
    position: relative;
    z-index: 2;
    padding: 120px 8%;
}

.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.hero h1 {
    font-size: 72px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #3cffb3, #4ddcff, #3cffb3);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: glow 8s infinite linear;
}

.hero p {
    margin-top: 30px;
    font-size: 20px;
    opacity: 0.85;
    max-width: 720px;
    line-height: 1.8;
}

@keyframes glow {
    0% { background-position: 0%; }
    100% { background-position: 300%; }
}

/* ================= 卡片 ================= */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 40px;
}

.card {
    background: rgba(20, 60, 50, 0.35);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 40px;
    border: 1px solid rgba(100,255,200,0.2);
    transition: 0.4s;
}

.card:hover {
    transform: translateY(-12px) scale(1.03);
    box-shadow: 0 20px 60px rgba(0,255,180,0.25);
}

.card h3 {
    font-size: 26px;
    margin-bottom: 20px;
    color: #7fffd4;
}

.card p {
    line-height: 1.7;
    opacity: 0.9;
}

/* ================= 数据统计 ================= */
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 30px;
    text-align: center;
}

.stat {
    padding: 40px;
    border-radius: 20px;
    background: linear-gradient(145deg, rgba(50,200,160,0.25), rgba(0,40,30,0.4));
    border: 1px solid rgba(0,255,180,0.25);
}

.stat span {
    font-size: 54px;
    color: #4dffcc;
    display: block;
}

.stat label {
    margin-top: 12px;
    display: block;
    opacity: 0.8;
}

/* ================= 底部 ================= */
footer {
    text-align: center;
    padding: 60px 20px;
    opacity: 0.6;
    font-size: 14px;
}

/* ================= 滚动光效 ================= */
.light {
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(100,255,200,0.35), transparent 70%);
    filter: blur(40px);
    pointer-events: none;
}
</style>
</head>

<body>
<div class="gradient-bg"></div>
<canvas id="particles"></canvas>

<section class="hero">
    <div>
        <h1>Eco · Future</h1>
        <p>
            当科技与自然共生，<br>
            我们不仅是在拯救地球，<br>
            而是在重塑未来文明。
        </p>
    </div>
</section>

<section>
    <div class="cards">
        <div class="card">
            <h3>🌱 可持续能源</h3>
            <p>
                通过太阳能、风能与智能电网技术，
                构建零碳排放的未来能源体系。
            </p>
        </div>
        <div class="card">
            <h3>🌊 海洋守护</h3>
            <p>
                AI 与环保技术结合，实时监测海洋污染，
                让蓝色星球重获新生。
            </p>
        </div>
        <div class="card">
            <h3>🌍 智慧生态</h3>
            <p>
                用数据连接森林、城市与人类，
                让地球成为一个可持续运行的生命系统。
            </p>
        </div>
    </div>
</section>

<section>
    <div class="stats">
        <div class="stat">
            <span data-target="72">0</span>
            <label>全球碳减排进度 %</label>
        </div>
        <div class="stat">
            <span data-target="86">0</span>
            <label>可再生能源占比 %</label>
        </div>
        <div class="stat">
            <span data-target="120">0</span>
            <label>已恢复生态区域 (万 km²)</label>
        </div>
    </div>
</section>

<footer>
    © 2035 Eco Future Initiative · One Planet · One Future
</footer>

<script>
/* ================= 粒子背景 ================= */
const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");
let w, h;
let particles = [];

function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

for (let i = 0; i < 120; i++) {
    particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 2 + 1,
        vx: Math.random() * 0.4 - 0.2,
        vy: Math.random() * 0.4 - 0.2
    });
}

function draw() {
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "rgba(120,255,200,0.7)";
    particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0 || p.x > w) p.vx *= -1;
        if (p.y < 0 || p.y > h) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
    });
    requestAnimationFrame(draw);
}
draw();

/* ================= 数字动画 ================= */
const counters = document.querySelectorAll("[data-target]");
const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            const el = entry.target;
            const target = +el.dataset.target;
            let count = 0;
            const step = target / 80;
            const timer = setInterval(() => {
                count += step;
                if (count >= target) {
                    el.innerText = target;
                    clearInterval(timer);
                } else {
                    el.innerText = Math.floor(count);
                }
            }, 30);
            observer.unobserve(el);
        }
    });
},{ threshold: 0.6 });

counters.forEach(c => observer.observe(c));
</script>
</body>
</html>
